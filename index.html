<!DOCTYPE html>
<html>
<head>
<title>Blink Runner</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="ui">
  <div id="score">0</div>
  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <div id="status">Waiting to start</div>
  </div>

  <canvas id="game"></canvas>
<div id="secretPanel" style="display:none;position:fixed;bottom:20px;right:20px;z-index:100;">
    <button id="cheatToggle" style="width:40px;height:40px;font-size:16px;background:rgba(0,255,255,0.2);color:#0ff;border:2px solid #0ff;box-shadow:0 0 15px #0ff;cursor:pointer;font-family:'Press Start 2P'">▼</button>
    <div id="cheatInput" style="display:none;margin-left:10px;padding:12px;background:rgba(0,0,0,0.95);border:2px solid #0ff;box-shadow:0 0 15px #0ff;position:absolute;right:50px;bottom:12px;width:200px;">
        <input id="cheatCode" placeholder="777/RAINBOW" style="width:130px;padding:6px;background:black;color:#0ff;border:1px solid #0ff;font-size:9px;font-family:'Press Start 2P';margin-right:5px">
        <button id="applyCode" style="padding:6px 10px;font-size:9px;background:black;color:#0ff;border:1px solid #0ff;cursor:pointer;">GO</button>
        <div id="cheatStatus" style="margin-top:8px;font-size:8px;color:#ff0"></div>
    </div>
</div>

  <div id="overlay">
    <h1>Game Over</h1>
    <button id="restartBtn">Restart</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="script.js"></script>
</body>
</html>
